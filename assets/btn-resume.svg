<svg xmlns="http://www.w3.org/2000/svg" width="200" height="52" viewBox="0 0 200 52" fill="none">
<style>
text{font-family:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif} .m{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes sweep{from{transform:translateX(-320px)}to{transform:translateX(520px)}}
.blink{animation:blink 1.1s step-end infinite} .glow{animation:glow 2.2s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}

</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".055"/></pattern>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffaf41"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffaf41" stop-opacity="0"/><stop offset=".5" stop-color="#ffaf41" stop-opacity=".9"/><stop offset="1" stop-color="#ffaf41" stop-opacity="0"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07030f"/><stop offset=".5" stop-color="#1a0f33"/><stop offset="1" stop-color="#7a4512"/></linearGradient>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>

</defs>
<rect x=".5" y=".5" width="199" height="51" rx="12" fill="#111111" stroke="#ffffff" stroke-opacity=".12"/><rect x="10" y="10" width="32" height="32" rx="9" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".45"/><text class="m" x="26" y="29.8" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">CV</text><text x="54" y="23" font-size="13.5" font-weight="600" fill="#ffffff">Résumé</text><text class="m" x="54" y="39" font-size="10" fill="#6b6b6b">resume.pdf</text><text x="186" y="31" font-size="13" fill="#6b6b6b" text-anchor="end">↗</text></svg>