<svg xmlns="http://www.w3.org/2000/svg" width="900" height="578" viewBox="0 0 900 578" fill="none">
<style>
text{font-family:'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif} .m{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes sweep{from{transform:translateX(-320px)}to{transform:translateX(1220px)}}
.blink{animation:blink 1.1s step-end infinite} .glow{animation:glow 2.2s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}

</style>
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".055"/></pattern>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffaf41"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffaf41" stop-opacity="0"/><stop offset=".5" stop-color="#ffaf41" stop-opacity=".9"/><stop offset="1" stop-color="#ffaf41" stop-opacity="0"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07030f"/><stop offset=".5" stop-color="#1a0f33"/><stop offset="1" stop-color="#7a4512"/></linearGradient>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>

</defs>
<clipPath id="dk"><rect width="900" height="578" rx="16"/></clipPath><g clip-path="url(#dk)"><rect width="900" height="578" fill="#0b0b0b"/><circle cx="765.0" cy="520.2" r="132.0" fill="#ffaf41" opacity=".07" filter="url(#soft)"/><circle cx="90.0" cy="57.800000000000004" r="120.0" fill="#a78bfa" opacity=".06" filter="url(#soft)"/><rect width="900" height="578" fill="url(#dots)"/></g><rect x=".5" y=".5" width="899" height="577" rx="16" stroke="#ffffff" stroke-opacity=".08"/><g filter="url(#shadow)"><rect x="18.0" y="18" width="423.0" height="262" rx="12" fill="#111111" fill-opacity=".96"/></g><path d="M18.0 30 a12 12 0 0 1 12 -12 h399.0 a12 12 0 0 1 12 12 v24 h-423.0 z" fill="#161616"/><line x1="18.0" y1="54" x2="441.0" y2="54" stroke="#ffffff" stroke-opacity=".06"/><circle cx="36.0" cy="36" r="5" fill="#ff5f57" fill-opacity="0.9"/><circle cx="52.0" cy="36" r="5" fill="#febc2e" fill-opacity="0.9"/><circle cx="68.0" cy="36" r="5" fill="#28c840" fill-opacity="0.9"/><text class="m" x="229.5" y="39.5" font-size="10" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.4">DIABETES_AGENT.PY</text><rect x="18.0" y="18" width="423.0" height="262" rx="12" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="44.0" cy="78" r="3.5" fill="#4ade80"/><text class="m" x="54.0" y="82" font-size="10" fill="#4ade80" letter-spacing="1.4">PERSONAL · COMPLETED</text><text x="38.0" y="114" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-.4">Diabetes Detection Agent</text><text class="m" x="38.0" y="135" font-size="11" fill="#6b6b6b">// Agentic AI + RAG</text><text x="38.0" y="164" font-size="13" fill="#969696">Two-stage ML model over 24 clinical parameters, paired</text><text x="38.0" y="183" font-size="13" fill="#969696">with a LangGraph + ChromaDB agentic RAG that writes</text><text x="38.0" y="202" font-size="13" fill="#969696">reports grounded in WHO &amp; ICMR guidelines.</text><rect x="38.0" y="238" width="80" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="49.0" y="253.8" font-size="10.5" fill="#dadada">LangGraph</text><rect x="123.645" y="238" width="73" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="134.64499999999998" y="253.8" font-size="10.5" fill="#dadada">ChromaDB</text><rect x="202.885" y="238" width="99" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="213.885" y="253.8" font-size="10.5" fill="#dadada">Scikit-learn</text><rect x="307.745" y="238" width="80" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="318.745" y="253.8" font-size="10.5" fill="#dadada">Streamlit</text><g filter="url(#shadow)"><rect x="459.0" y="18" width="423.0" height="262" rx="12" fill="#111111" fill-opacity=".96"/></g><path d="M459.0 30 a12 12 0 0 1 12 -12 h399.0 a12 12 0 0 1 12 12 v24 h-423.0 z" fill="#161616"/><line x1="459.0" y1="54" x2="882.0" y2="54" stroke="#ffffff" stroke-opacity=".06"/><circle cx="477.0" cy="36" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="493.0" cy="36" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="509.0" cy="36" r="5" fill="#2e2e2e" fill-opacity="1"/><text class="m" x="670.5" y="39.5" font-size="10" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.4">KUDOS_TO_CODE.TSX</text><rect x="459.0" y="18" width="423.0" height="262" rx="12" stroke="#ffffff" stroke-opacity="0.06"/><circle cx="485.0" cy="78" r="3.5" fill="#ffaf41"/><circle class="glow" cx="485.0" cy="78" r="7" fill="#ffaf41" opacity=".4"/><text class="m" x="495.0" y="82" font-size="10" fill="#ffaf41" letter-spacing="1.4">PERSONAL · ACTIVE</text><text x="479.0" y="114" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-.4">Kudos To Code</text><text class="m" x="479.0" y="135" font-size="11" fill="#6b6b6b">// Developer profile platform</text><text x="479.0" y="164" font-size="13" fill="#969696">One shareable profile that unifies GitHub activity,</text><text x="479.0" y="183" font-size="13" fill="#969696">projects and LeetCode / Codeforces stats in a single</text><text x="479.0" y="202" font-size="13" fill="#969696">interactive page.</text><rect x="479.0" y="238" width="86" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="490.0" y="253.8" font-size="10.5" fill="#dadada">Next.js 16</text><rect x="571.05" y="238" width="73" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="582.05" y="253.8" font-size="10.5" fill="#dadada">React 19</text><rect x="650.29" y="238" width="67" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="661.29" y="253.8" font-size="10.5" fill="#dadada">Express</text><rect x="723.125" y="238" width="67" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="734.125" y="253.8" font-size="10.5" fill="#dadada">MongoDB</text><g filter="url(#shadow)"><rect x="18.0" y="298" width="423.0" height="262" rx="12" fill="#111111" fill-opacity=".96"/></g><path d="M18.0 310 a12 12 0 0 1 12 -12 h399.0 a12 12 0 0 1 12 12 v24 h-423.0 z" fill="#161616"/><line x1="18.0" y1="334" x2="441.0" y2="334" stroke="#ffffff" stroke-opacity=".06"/><circle cx="36.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="52.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="68.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><text class="m" x="229.5" y="319.5" font-size="10" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.4">LEAD_PIPELINE.N8N</text><rect x="18.0" y="298" width="423.0" height="262" rx="12" stroke="#ffffff" stroke-opacity="0.06"/><circle cx="44.0" cy="358" r="3.5" fill="#a78bfa"/><text class="m" x="54.0" y="362" font-size="10" fill="#a78bfa" letter-spacing="1.4">CLIENT · STUDYZONE365</text><text x="38.0" y="394" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-.4">Lead &amp; Social Automation</text><text class="m" x="38.0" y="415" font-size="11" fill="#6b6b6b">// 5 production pipelines</text><text x="38.0" y="444" font-size="13" fill="#969696">n8n pipelines on Meta, LinkedIn &amp; WhatsApp Business</text><text x="38.0" y="463" font-size="13" fill="#969696">APIs that put 90% of social posting and 70% of lead</text><text x="38.0" y="482" font-size="13" fill="#969696">qualification on autopilot.</text><rect x="38.0" y="518" width="41" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="49.0" y="533.8" font-size="10.5" fill="#dadada">n8n</text><rect x="85.215" y="518" width="60" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="96.215" y="533.8" font-size="10.5" fill="#dadada">Python</text><rect x="151.645" y="518" width="99" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="162.645" y="533.8" font-size="10.5" fill="#dadada">WhatsApp API</text><rect x="256.505" y="518" width="60" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="267.505" y="533.8" font-size="10.5" fill="#dadada">Sheets</text><g filter="url(#shadow)"><rect x="459.0" y="298" width="423.0" height="262" rx="12" fill="#111111" fill-opacity=".96"/></g><path d="M459.0 310 a12 12 0 0 1 12 -12 h399.0 a12 12 0 0 1 12 12 v24 h-423.0 z" fill="#161616"/><line x1="459.0" y1="334" x2="882.0" y2="334" stroke="#ffffff" stroke-opacity=".06"/><circle cx="477.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="493.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><circle cx="509.0" cy="316" r="5" fill="#2e2e2e" fill-opacity="1"/><text class="m" x="670.5" y="319.5" font-size="10" fill="#6b6b6b" text-anchor="middle" letter-spacing="1.4">VOICE_AGENTS.JSON</text><rect x="459.0" y="298" width="423.0" height="262" rx="12" stroke="#ffffff" stroke-opacity="0.06"/><circle cx="485.0" cy="358" r="3.5" fill="#a78bfa"/><text class="m" x="495.0" y="362" font-size="10" fill="#a78bfa" letter-spacing="1.4">CLIENT · STUDYZONE365</text><text x="479.0" y="394" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-.4">Recruitment Voice Agents</text><text class="m" x="479.0" y="415" font-size="11" fill="#6b6b6b">// Conversational AI</text><text x="479.0" y="444" font-size="13" fill="#969696">Two real-time voice agents that screen candidates, run</text><text x="479.0" y="463" font-size="13" fill="#969696">personalised outreach and book interviews — half of all</text><text x="479.0" y="482" font-size="13" fill="#969696">recruitment calls automated.</text><rect x="479.0" y="518" width="80" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="490.0" y="533.8" font-size="10.5" fill="#dadada">Retell AI</text><rect x="564.645" y="518" width="86" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="575.645" y="533.8" font-size="10.5" fill="#dadada">ElevenLabs</text><rect x="656.6949999999999" y="518" width="60" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="667.6949999999999" y="533.8" font-size="10.5" fill="#dadada">Python</text><rect x="723.125" y="518" width="73" height="24" rx="7" fill="#181818" stroke="#ffffff" stroke-opacity=".08"/><text class="m" x="734.125" y="533.8" font-size="10.5" fill="#dadada">Webhooks</text></svg>